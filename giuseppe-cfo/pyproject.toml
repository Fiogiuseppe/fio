[project]
name = "giuseppe-cfo"
version = "0.1.0"
description = "Personal CFO assistant for a Danish PMV"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client",
  "google-auth",
  "openai",
  "reportlab",
  "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
